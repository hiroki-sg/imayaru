<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="いまやる">
<title>いまやる</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#f7f8f6;--surface:#fff;--text:#161916;--sub:#767c77;--line:#e4e7e3;
  --accent:#477867;--soft:#e7f0ec;--danger:#b84a4a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Yu Gothic UI",sans-serif;color:var(--text)}
body{min-height:100dvh}
button,input{font:inherit}
input[type=radio]{position:absolute;opacity:0;pointer-events:none}
input, button, select, textarea{max-width:100%}
.shell{max-width:620px;margin:auto;min-height:100dvh;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
header{
  position:relative;
  padding:calc(18px + env(safe-area-inset-top)) 86px 8px 18px
}
.app-version{
  position:absolute;
  top:calc(21px + env(safe-area-inset-top));
  right:18px;
  font-size:10px;
  font-weight:600;
  letter-spacing:.02em;
  color:#a1a6a2;
  white-space:nowrap;
  user-select:none;
  -webkit-user-select:none
}
h1{font-size:28px;margin:0;letter-spacing:-.03em}
#sub{font-size:13px;color:var(--sub);margin-top:5px}
main{padding:8px 14px 28px}
.page{display:none}

/* JSなしでもタブ切替が動く */
#tab-home:checked ~ .shell main .home,
#tab-list:checked ~ .shell main .list,
#tab-add:checked ~ .shell main .add{display:block}
#tab-home:checked ~ .bottom-nav label[for=tab-home],
#tab-list:checked ~ .bottom-nav label[for=tab-list],
#tab-add:checked ~ .bottom-nav label[for=tab-add]{background:var(--soft);color:var(--accent)}

.section{margin:14px 0 22px}
.section-title{font-size:13px;font-weight:650;color:var(--sub);margin:0 4px 9px}
.segment{display:grid;gap:8px}
.segment.four{grid-template-columns:repeat(4,1fr)}
.segment.three{grid-template-columns:repeat(3,1fr)}
.segment label{
  min-height:46px;border:1px solid var(--line);border-radius:14px;background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-weight:680
}
#time15:checked ~ .shell label[for=time15],
#time30:checked ~ .shell label[for=time30],
#time60:checked ~ .shell label[for=time60],
#time90:checked ~ .shell label[for=time90],
#energy1:checked ~ .shell label[for=energy1],
#energy2:checked ~ .shell label[for=energy2],
#energy3:checked ~ .shell label[for=energy3]{
  background:var(--accent);border-color:var(--accent);color:#fff
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:17px}
.recommend{padding:20px}
.eyebrow{font-size:12px;color:var(--accent);font-weight:760;margin-bottom:7px}
.bigtitle{font-size:22px;font-weight:760;line-height:1.35}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.badge{font-size:12px;background:#f0f2ef;color:var(--sub);padding:6px 9px;border-radius:999px}
.why{border-top:1px solid var(--line);margin-top:14px;padding-top:13px;color:var(--sub);font-size:13px;line-height:1.6}
.primary{width:100%;border:0;border-radius:14px;min-height:50px;background:var(--accent);color:#fff;font-weight:760;margin-top:14px}
.secondary{border:1px solid var(--line);border-radius:13px;background:var(--surface);min-height:46px;font-weight:680}
.ghost{width:100%;border:0;background:transparent;color:var(--sub);min-height:42px;font-weight:650}
.input{
  display:block;width:100%;max-width:100%;min-width:0;
  min-height:48px;border:1px solid var(--line);border-radius:14px;background:var(--surface);
  padding:0 14px;outline:none
}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.field{margin-bottom:17px}
.field label.title{display:block;font-size:13px;color:var(--sub);font-weight:650;margin:0 0 8px 2px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choices button{min-height:44px;border:1px solid var(--line);border-radius:13px;background:var(--surface);font-weight:680}
.choices button.active{background:var(--soft);color:var(--accent);border-color:transparent}

.duration-picker-wrap{
  border:1px solid var(--line);border-radius:16px;padding:14px;background:#fbfcfa;overflow:hidden
}
.duration-display{
  font-size:24px;font-weight:760;letter-spacing:-.02em;margin:1px 0 12px
}
.native-picker-shell{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  max-width:100%;
  height:52px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--surface);
  overflow:hidden
}
.native-picker-text{
  width:100%;
  padding:0 14px;
  text-align:center;
  font-size:18px;
  font-weight:700;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  pointer-events:none
}
.native-picker-text.placeholder{color:#9da29e;font-weight:600}
.native-picker-input{
  position:absolute;
  inset:0;
  display:block;
  width:100%;
  height:100%;
  min-width:0;
  max-width:none;
  margin:0;
  padding:0;
  border:0;
  opacity:0;
  cursor:pointer;
  z-index:2
}
.native-picker-shell:focus-within{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--soft)
}

.form-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;overflow:hidden}
.note{font-size:12px;color:var(--sub);line-height:1.6;margin-top:7px}
.search{margin-bottom:11px}
.list-tabs{display:flex;gap:7px;margin-bottom:11px}
.list-tabs label{
  border:0;border-radius:999px;padding:8px 12px;background:#edf0ed;color:var(--sub);
  font-weight:650;cursor:pointer
}
#list-open:checked ~ .list-tabs label[for=list-open],
#list-done:checked ~ .list-tabs label[for=list-done]{
  background:var(--soft);color:var(--accent)
}
.list-panel{display:none}
#list-open:checked ~ .list-panels .open-panel{display:block}
#list-done:checked ~ .list-panels .done-panel{display:block}
.list-edit-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:0 0 10px
}
.list-edit-toolbar .left-actions,
.list-edit-toolbar .right-actions{
  display:flex;
  align-items:center;
  gap:8px
}
.list-toolbar-btn{
  height:36px;
  padding:0 12px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--surface);
  color:var(--text);
  font-size:13px;
  font-weight:700
}
.list-toolbar-btn.active{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff
}
.bulk-delete-bar{
  position:sticky;
  bottom:76px;
  z-index:8;
  margin-top:14px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:16px;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px)
}
.bulk-delete-btn{
  width:100%;
  height:46px;
  border:0;
  border-radius:13px;
  background:#ff4d4f;
  color:#fff;
  font-size:15px;
  font-weight:760
}
.bulk-delete-btn:disabled{
  opacity:.35;
}
.select-circle{
  width:24px;
  height:24px;
  border:2px solid var(--line);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  background:var(--surface)
}
.select-circle.selected{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff
}
.select-circle.selected::after{
  content:'✓';
  font-size:14px;
  font-weight:800;
  line-height:1
}
.task-list.editing .task-row{
  grid-template-columns:auto 1fr auto;
}
.task-list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.swipe-item{
  position:relative;
  overflow:hidden;
  border-bottom:1px solid var(--line);
  background:var(--surface)
}
.swipe-item:last-child{border-bottom:0}
.swipe-actions{
  position:absolute;
  top:0;right:0;bottom:0;
  display:flex;
  align-items:stretch;
  justify-content:flex-end
}
.swipe-delete{
  width:88px;
  border:0;
  border-radius:0;
  background:#ff4d4f;
  color:#fff;
  font-weight:760;
  font-size:15px
}
.task-row{
  position:relative;
  width:100%;
  border:0;
  background:var(--surface);
  padding:15px 16px;
  text-align:left;
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  transform:translateX(0);
  transition:transform .18s ease
}
.swipe-item.open .task-row{transform:translateX(-88px)}
.row-title{font-size:16px;font-weight:700}
.row-sub{font-size:12px;color:var(--sub);display:flex;gap:8px;flex-wrap:wrap;margin-top:5px}
.row-action{font-size:12px;color:var(--accent);font-weight:700;align-self:center}
.empty{text-align:center;color:var(--sub);padding:34px 20px}
.empty strong{display:block;color:var(--text);font-size:17px;margin-bottom:5px}
.urgent-wrap{margin:-2px 0 18px}
.urgent-banner{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  min-height:48px;
  padding:0 14px;
  border:1px solid #f0d9cf;
  border-radius:14px;
  background:#fff7f3;
  color:#9b4a39;
  font-size:13px;
  font-weight:700;
  cursor:pointer
}
.urgent-banner .arrow{font-size:16px;color:#b16a59}
.alt{display:grid;gap:8px;margin-top:10px}
.alt button{border:1px solid var(--line);border-radius:15px;background:var(--surface);padding:13px 14px;text-align:left}
.alt strong{display:block}.alt span{display:block;font-size:12px;color:var(--sub);margin-top:4px}
.progress-picker{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.progress-label{font-size:12px;color:var(--sub);font-weight:650;margin-bottom:8px}
.progress-options{display:flex;gap:7px;flex-wrap:wrap}
.progress-chip{
  min-width:58px;height:38px;padding:0 11px;border:1px solid var(--line);border-radius:999px;
  background:var(--surface);color:var(--text);font-size:13px;font-weight:700
}
.progress-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.progress-custom-row{display:flex;align-items:center;gap:8px;margin-top:9px}
.progress-custom{
  width:92px;min-width:0;height:40px;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);padding:0 10px;text-align:center;font-size:14px;outline:none
}
.progress-custom:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.progress-unit{font-size:13px;color:var(--sub)}
.bottom-nav{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(620px,100%);
  display:grid;grid-template-columns:repeat(3,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(18px);z-index:20
}
.bottom-nav label{height:56px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:660;color:var(--sub);cursor:pointer}
.nav-icon{font-size:20px;line-height:1.2;margin-bottom:2px}
.fab-label{
  position:fixed;right:max(18px,calc((100vw - 620px)/2 + 18px));bottom:calc(86px + env(safe-area-inset-bottom));
  width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 10px 28px rgba(52,90,74,.22);z-index:15
}
#tab-list:not(:checked) ~ .shell .fab-label{display:none}
.form-actions{display:grid;grid-template-columns:1fr 1.5fr;gap:8px;margin-top:12px}
.nojs{margin-top:12px;color:var(--danger);font-size:13px;line-height:1.6}
.runtime-warning{
  display:none;margin:12px 0;padding:12px 14px;border-radius:14px;
  background:#fff3ef;color:#9b4a39;font-size:13px;line-height:1.5
}

.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#202521;color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;opacity:0;transition:.2s;z-index:40;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- ナビゲーションはCSSだけでも動く -->
<input type="radio" name="tab" id="tab-home" checked>
<input type="radio" name="tab" id="tab-list">
<input type="radio" name="tab" id="tab-add">

<!-- 時間・余力も選択自体はCSSだけでも反応 -->
<input type="radio" name="time" id="time15" value="15">
<input type="radio" name="time" id="time30" value="30" checked>
<input type="radio" name="time" id="time60" value="60">
<input type="radio" name="time" id="time90" value="90">
<input type="radio" name="energy" id="energy1" value="1">
<input type="radio" name="energy" id="energy2" value="2" checked>
<input type="radio" name="energy" id="energy3" value="3">

<div class="shell">
<header>
  <h1 id="title">いまやる</h1>
  <div id="sub">空いた時間に、迷わずひとつ。</div>
  <div class="app-version">ver.1.1.4</div>
</header>

<main>
  <section class="page home">
    <div class="section">
      <div class="section-title">いま何分ある？</div>
      <div class="segment four">
        <label for="time15">15分</label>
        <label for="time30">30分</label>
        <label for="time60">60分</label>
        <label for="time90">90分</label>
      </div>
      <div style="margin-top:9px">
        <input id="customTime" class="input" type="number" inputmode="numeric" min="5" step="5" placeholder="自由入力（分）">
      </div>
    </div>

    <div class="section">
      <div class="section-title">いまの余力は？</div>
      <div class="segment three">
        <label for="energy1">疲れた</label>
        <label for="energy2">普通</label>
        <label for="energy3">元気</label>
      </div>
    </div>

    <div id="urgentWrap" class="urgent-wrap"></div>

    <div class="section" id="recommendWrap"></div>
  </section>

  <section class="page list">
    <div class="search"><input id="search" class="input" placeholder="タスクを検索"></div>
    <input type="radio" name="listmode" id="list-open" value="open" checked>
    <input type="radio" name="listmode" id="list-done" value="done">

    <div class="list-tabs">
      <label for="list-open">未完了</label>
      <label for="list-done">完了</label>
    </div>

    <div class="list-panels">
      <div id="openListWrap" class="list-panel open-panel"></div>
      <div id="doneListWrap" class="list-panel done-panel"></div>
    </div>
  </section>

  <label for="tab-add" class="fab-label" aria-label="タスク追加">＋</label>

  <section class="page add">
    <form id="taskForm">
    <div id="runtimeWarning" class="runtime-warning"></div>
    <div class="form-card">
      <div class="field">
        <label class="title" for="taskName">タスク名</label>
        <input id="taskName" class="input" maxlength="80" placeholder="例：循環器の復習">
      </div>

      <div class="field">
        <label class="title">基本優先順位</label>
        <div class="choices" id="priority">
          <button type="button" data-v="1">低</button>
          <button type="button" data-v="2" class="active">中</button>
          <button type="button" data-v="3">高</button>
        </div>
      </div>

      <div class="field">
        <label class="title" for="durationPicker">必要時間</label>
        <div class="duration-picker-wrap">
          <div class="duration-display" id="durationDisplay">30分</div>
          <div class="native-picker-shell">
            <div class="native-picker-text" id="durationControlText">0:30</div>
            <input
              id="durationPicker"
              class="native-picker-input"
              type="time"
              value="00:30"
              min="00:05"
              max="23:55"
              step="300"
              aria-label="必要時間を選択"
            >
          </div>
        </div>
      </div>

      <div class="field">
        <label class="title">負荷</label>
        <div class="choices" id="load">
          <button type="button" data-v="1">低</button>
          <button type="button" data-v="2" class="active">中</button>
          <button type="button" data-v="3">高</button>
        </div>
      </div>

      <div class="field">
        <label class="title" for="deadline">締切日時（任意）</label>
        <div class="native-picker-shell">
          <div class="native-picker-text placeholder" id="deadlineControlText">未設定</div>
          <input id="deadline" class="native-picker-input" type="datetime-local" step="300" aria-label="締切日時を選択">
        </div>
        <div class="note">締切が近づくほど自動でおすすめ順位が上がります。</div>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" id="deleteBtn" class="secondary" style="display:none;color:var(--danger)">削除</button>
      <button type="submit" id="saveBtn" class="primary" style="margin-top:0">追加する</button>
    </div>
    </form>
    <noscript>
      <div class="card nojs">
        この表示環境ではタスクの保存機能を実行できません。SafariやGitHub Pagesで開くと利用できます。
      </div>
    </noscript>
  </section>
</main>
</div>

<nav class="bottom-nav">
  <label for="tab-home"><span class="nav-icon">◎</span>おすすめ</label>
  <label for="tab-list"><span class="nav-icon">☷</span>一覧</label>
  <label for="tab-add"><span class="nav-icon">＋</span>追加</label>
</nav>
<div class="toast" id="toast"></div>

<script>
(() => {
  const K='imayaru_v2_tasks';
  let tasks = [];
  let editId = null;
  let selectedRecommendId = null;
  let selectedProgressMinutes = null;

  let listEditMode = false;
  let listEditTarget = 'open';
  let selectedListIds = new Set();
  const $ = id => document.getElementById(id);

  try { tasks = JSON.parse(localStorage.getItem(K)) || []; } catch(e){ tasks=[]; }

  let storageAvailable=true;
  const save = () => {
    try{
      localStorage.setItem(K, JSON.stringify(tasks));
      storageAvailable=true;
      return true;
    }catch(e){
      storageAvailable=false;
      const w=$('runtimeWarning');
      if(w){
        w.style.display='block';
        w.textContent='この表示環境では端末保存が使えません。タスクはこの画面を閉じるまで一時的に保持します。';
      }
      return false;
    }
  };
  const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

  function selectedRadio(name){
    return Number(document.querySelector(`input[name="${name}"]:checked`)?.value || 0);
  }
  function freeTime(){
    return Number($('customTime').value || 0) || selectedRadio('time') || 30;
  }
  function energy(){ return selectedRadio('energy') || 2; }

  function days(deadline){
    if(!deadline) return null;
    const due=new Date(deadline);
    if(Number.isNaN(due.getTime())) return null;
    return (due - new Date()) / 86400000;
  }
  function deadlineBoost(t){
    const d=days(t.deadline);
    if(d===null) return 0;
    if(d<0) return 100;
    return Math.max(0,55-d*4.5)+Math.min(28,(t.minutes/Math.max(d,1))/10);
  }
  function score(t){
    const p={1:25,2:50,3:78}[t.priority]||50;
    const e=energy();

    let loadFit=0;
    if(e===1 && t.load===1) loadFit=18;
    else if(e===1 && t.load===2) loadFit=-6;
    else if(e===1 && t.load===3) loadFit=-14;
    else if(e===2 && t.load===1) loadFit=6;
    else if(e===2 && t.load===2) loadFit=18;
    else if(e===2 && t.load===3) loadFit=-6;
    else if(e===3 && t.load===1) loadFit=3;
    else if(e===3 && t.load===2) loadFit=9;
    else if(e===3 && t.load===3) loadFit=18;

    const mins=freeTime();
    const timeFit=t.minutes<=mins?18:8;
    return p+deadlineBoost(t)+loadFit+timeFit;
  }
  function dl(t){
    const d=days(t.deadline);
    if(d===null) return '';
    if(d<0) return '期限超過';
    const hours=Math.ceil(d*24);
    if(hours<=1) return '1時間以内';
    if(hours<24) return 'あと'+hours+'時間';
    return 'あと'+Math.ceil(d)+'日';
  }
  const pl=n=>['','低','中','高'][n]||'中';
  const ll=n=>['','低','中','高'][n]||'中';

  function ranked(){
    return tasks.filter(t=>!t.completed).map(t=>({...t,_score:score(t)})).sort((a,b)=>b._score-a._score);
  }

  function renderUrgent(){
    const wrap=$('urgentWrap');
    if(!wrap) return;
    const urgent=tasks
      .filter(t=>!t.completed && t.deadline)
      .filter(t=>{
        const d=days(t.deadline);
        return d!==null && d<=1;
      })
      .sort((a,b)=>new Date(a.deadline)-new Date(b.deadline));

    if(!urgent.length){
      wrap.innerHTML='';
      return;
    }
    const count=urgent.length;
    wrap.innerHTML=`
      <label for="tab-list" class="urgent-banner" aria-label="締切間近のタスクを一覧で見る">
        <span>締切間近 ${count}件 ⚠️</span>
        <span class="arrow">›</span>
      </label>`;
  }

  function renderRecommend(){
    const r=ranked(), wrap=$('recommendWrap');

    if(!r.length){
      selectedRecommendId=null;
      selectedProgressMinutes=null;
      wrap.innerHTML='';
      return;
    }

    let selected=r.find(t=>t.id===selectedRecommendId);
    if(!selected){
      selected=r[0];
      selectedRecommendId=selected.id;
      selectedProgressMinutes=null;
    }

    const others=r.filter(t=>t.id!==selected.id);
    const mins=freeTime();
    const partial=selected.minutes>mins;

    if(selectedProgressMinutes===null){
      selectedProgressMinutes=Math.min(mins, selected.minutes);
    }
    selectedProgressMinutes=Math.max(5, Math.min(selectedProgressMinutes, selected.minutes));

    const quickBase=[5,10,15,30,60];
    const quickOptions=[...new Set(
      quickBase.filter(v=>v<=selected.minutes)
        .concat([Math.min(mins,selected.minutes)])
    )].sort((a,b)=>a-b);

    wrap.innerHTML=`
      <div class="section-title">いまやるなら</div>
      <div class="card recommend">
        <div class="eyebrow">${selected.minutes>selectedProgressMinutes?selectedProgressMinutes+'分だけ進める':'おすすめ'}</div>
        <div class="bigtitle">${esc(selected.name)}</div>
        <div class="meta">
          <span class="badge">${selected.minutes}分</span>
          <span class="badge">負荷 ${ll(selected.load)}</span>
          <span class="badge">優先 ${pl(selected.priority)}</span>
          ${dl(selected)?`<span class="badge">${dl(selected)}</span>`:''}
        </div>
        <div class="why">${selected.priority===3?'基本優先順位が高いです。 ':''}${dl(selected)?'締切も考慮しています。 ':''}${selected.minutes<=mins?'今の空き時間で終えられます。':'好きな時間だけ進められます。'}</div>

        ${selected.minutes>5 ? `
          <div class="progress-picker">
            <div class="progress-label">進める時間</div>
            <div class="progress-options">
              ${quickOptions.map(v=>`
                <button type="button" class="progress-chip ${v===selectedProgressMinutes?'active':''}" data-progress-minutes="${v}">
                  ${v}分
                </button>`).join('')}
            </div>
            <div class="progress-custom-row">
              <input
                id="progressCustom"
                class="progress-custom"
                type="number"
                inputmode="numeric"
                min="5"
                max="${selected.minutes}"
                step="5"
                placeholder="自由"
                value="${quickOptions.includes(selectedProgressMinutes)?'':selectedProgressMinutes}"
              >
              <span class="progress-unit">分</span>
            </div>
          </div>
        `:''}

        <button class="primary" type="button" id="completeTop">
          ${selectedProgressMinutes>=selected.minutes?'完了にする':selectedProgressMinutes+'分やった'}
        </button>
      </div>

      ${others.length ? `
        <div class="section-title" style="margin-top:15px">ほかの候補</div>
        <div class="alt">
          ${others.slice(0,4).map(t=>`
            <button type="button" data-select-recommend="${t.id}">
              <strong>${esc(t.name)}</strong>
              <span>${t.minutes}分 ・ 負荷 ${ll(t.load)} ・ 優先 ${pl(t.priority)}${dl(t)?' ・ '+dl(t):''}</span>
            </button>`).join('')}
        </div>
      `:''}
    `;

    document.querySelectorAll('[data-progress-minutes]').forEach(btn=>{
      btn.onclick=()=>{
        selectedProgressMinutes=Number(btn.dataset.progressMinutes);
        renderRecommend();
      };
    });

    const custom=$('progressCustom');
    if(custom){
      custom.addEventListener('input',()=>{
        const raw=Number(custom.value);
        if(!raw) return;
        selectedProgressMinutes=Math.max(5,Math.min(selected.minutes,raw));
        document.querySelectorAll('[data-progress-minutes]').forEach(b=>{
          b.classList.toggle('active',Number(b.dataset.progressMinutes)===selectedProgressMinutes);
        });
        const action=$('completeTop');
        if(action){
          action.textContent=selectedProgressMinutes>=selected.minutes
            ? '完了にする'
            : selectedProgressMinutes+'分やった';
        }
      });
    }

    $('completeTop').onclick=()=>{
      const original=tasks.find(x=>x.id===selected.id);
      if(!original) return;

      const progressed=Math.max(5,Math.min(selectedProgressMinutes||mins, original.minutes));

      if(progressed>=original.minutes){
        original.completed=true;
        original.completedAt=new Date().toISOString();
        toast('完了にしました');
      }else{
        original.minutes=Math.max(5,original.minutes-progressed);
        toast(progressed+'分ぶん進めました');
      }

      selectedRecommendId=null;
      selectedProgressMinutes=null;
      save();
      renderAll();
    };

    document.querySelectorAll('[data-select-recommend]').forEach(btn=>{
      btn.onclick=()=>{
        selectedRecommendId=btn.dataset.selectRecommend;
        selectedProgressMinutes=null;
        renderRecommend();
        requestAnimationFrame(()=>{
          const card=document.querySelector('.recommend');
          if(card) card.scrollIntoView({behavior:'smooth',block:'nearest'});
        });
      };
    });
  }

  function renderList(){
    const q=$('search').value.trim().toLowerCase();

    let openArr=tasks
      .filter(t=>!t.completed)
      .filter(t=>!q||t.name.toLowerCase().includes(q))
      .map(t=>({...t,_score:score(t)}))
      .sort((a,b)=>b._score-a._score);

    let doneArr=tasks
      .filter(t=>t.completed)
      .filter(t=>!q||t.name.toLowerCase().includes(q))
      .sort((a,b)=>new Date(b.completedAt||0)-new Date(a.completedAt||0));

    const makeToolbar=(target, arr)=>{
      const editing=listEditMode && listEditTarget===target;
      const visibleIds=new Set(arr.map(t=>String(t.id)));

      if(editing){
        selectedListIds=new Set([...selectedListIds].filter(id=>visibleIds.has(String(id))));
      }

      const allSelected=editing && arr.length && arr.every(t=>selectedListIds.has(String(t.id)));

      return `
        <div class="list-edit-toolbar">
          <div class="left-actions">
            ${editing ? `<button type="button" class="list-toolbar-btn" data-select-all="${target}">
              ${allSelected?'選択解除':'すべて選択'}
            </button>` : ''}
          </div>
          <div class="right-actions">
            <button type="button" class="list-toolbar-btn ${editing?'active':''}" data-toggle-edit="${target}">
              ${editing?'完了':'編集'}
            </button>
          </div>
        </div>
      `;
    };

    const renderRows=(arr,target)=>{
      const editing=listEditMode && listEditTarget===target;

      if(!arr.length){
        return `<div class="card empty"><strong>${target==='open'?'未完了タスクはありません':'完了タスクはまだありません'}</strong></div>`;
      }

      return `<div class="task-list ${editing?'editing':''}">${arr.map(t=>{
        const selected=selectedListIds.has(String(t.id));
        return `
          <div class="swipe-item ${editing?'edit-mode':''}" data-swipe-item="${t.id}">
            ${editing ? '' : `
              <div class="swipe-actions">
                <button type="button" class="swipe-delete" data-delete-row="${t.id}">削除</button>
              </div>
            `}
            <button class="task-row" type="button" data-row="${t.id}" data-list-target="${target}">
              ${editing ? `<span class="select-circle ${selected?'selected':''}" aria-hidden="true"></span>` : ''}
              <div>
                <div class="row-title">${esc(t.name)}</div>
                <div class="row-sub">
                  <span>${t.minutes}分</span>
                  <span>負荷 ${ll(t.load)}</span>
                  <span>優先 ${pl(t.priority)}</span>
                  ${dl(t)?`<span>${dl(t)}</span>`:''}
                </div>
              </div>
              <div class="row-action">${editing?(selected?'選択中':'選択'):(target==='open'?'編集':'完了')}</div>
            </button>
          </div>
        `;
      }).join('')}</div>`;
    };

    const bulkBar=(target)=>{
      const editing=listEditMode && listEditTarget===target;
      if(!editing) return '';
      return `
        <div class="bulk-delete-bar">
          <button type="button" class="bulk-delete-btn" data-bulk-delete="${target}" ${selectedListIds.size?'':'disabled'}>
            ${selectedListIds.size ? selectedListIds.size+'件を削除' : '削除する項目を選択'}
          </button>
        </div>
      `;
    };

    $('openListWrap').innerHTML =
      makeToolbar('open', openArr) +
      renderRows(openArr,'open') +
      bulkBar('open');

    $('doneListWrap').innerHTML =
      makeToolbar('done', doneArr) +
      renderRows(doneArr,'done') +
      bulkBar('done');

    document.querySelectorAll('[data-toggle-edit]').forEach(btn=>{
      btn.onclick=()=>{
        const target=btn.dataset.toggleEdit;
        const sameMode=listEditMode && listEditTarget===target;

        listEditMode=!sameMode;
        listEditTarget=target;
        selectedListIds.clear();
        closeAllSwipeItems();
        renderList();
      };
    });

    document.querySelectorAll('[data-select-all]').forEach(btn=>{
      btn.onclick=()=>{
        const target=btn.dataset.selectAll;
        const arr=target==='open'?openArr:doneArr;
        const allSelected=arr.length && arr.every(t=>selectedListIds.has(String(t.id)));

        if(allSelected){
          selectedListIds.clear();
        }else{
          selectedListIds=new Set(arr.map(t=>String(t.id)));
        }
        renderList();
      };
    });

    document.querySelectorAll('[data-bulk-delete]').forEach(btn=>{
      btn.onclick=()=>{
        if(!selectedListIds.size) return;
        const count=selectedListIds.size;

        tasks=tasks.filter(t=>!selectedListIds.has(String(t.id)));
        selectedListIds.clear();
        listEditMode=false;
        selectedRecommendId=null;
        selectedProgressMinutes=null;

        save();
        renderAll();
        toast(count+'件削除しました');
      };
    });

    document.querySelectorAll('[data-row]').forEach(btn=>{
      btn.onclick=()=>{
        const id=String(btn.dataset.row);
        const target=btn.dataset.listTarget;
        const editing=listEditMode && listEditTarget===target;

        if(editing){
          if(selectedListIds.has(id)) selectedListIds.delete(id);
          else selectedListIds.add(id);
          renderList();
          return;
        }

        const parent=btn.closest('.swipe-item');
        if(parent && parent.classList.contains('open')){
          parent.classList.remove('open');
          return;
        }

        openEdit(btn.dataset.row);
      };
    });

    if(!listEditMode) bindSwipeEvents();
  }

  function bindSwipeEvents(){
    document.querySelectorAll('[data-delete-row]').forEach(btn=>{
      btn.onclick=(e)=>{
        e.stopPropagation();
        removeTaskById(btn.dataset.deleteRow);
      };
    });

    document.querySelectorAll('.swipe-item').forEach(item=>{
      let startX=0, startY=0, dragging=false, horizontal=false;

      item.addEventListener('touchstart',e=>{
        const t=e.touches[0];
        startX=t.clientX;
        startY=t.clientY;
        dragging=true;
        horizontal=false;
      }, {passive:true});

      item.addEventListener('touchmove',e=>{
        if(!dragging) return;
        const t=e.touches[0];
        const dx=t.clientX-startX;
        const dy=t.clientY-startY;

        if(!horizontal){
          if(Math.abs(dx)>10 && Math.abs(dx)>Math.abs(dy)) horizontal=true;
          else if(Math.abs(dy)>10){ dragging=false; return; }
        }
        if(!horizontal) return;

        if(dx < -18){
          closeAllSwipeItems(item.dataset.swipeItem);
          item.classList.add('open');
        }else if(dx > 18){
          item.classList.remove('open');
        }
      }, {passive:true});

      item.addEventListener('touchend',()=>{ dragging=false; });
    });
  }

  function removeTaskById(id){
    tasks=tasks.filter(t=>t.id!==id);
    selectedListIds.delete(String(id));
    if(selectedRecommendId===id){
      selectedRecommendId=null;
      selectedProgressMinutes=null;
    }
    save();
    renderAll();
    toast('削除しました');
  }

  function closeAllSwipeItems(exceptId=''){
    document.querySelectorAll('.swipe-item.open').forEach(el=>{
      if(exceptId && el.dataset.swipeItem===exceptId) return;
      el.classList.remove('open');
    });
  }

  function setChoice(id,v){
    document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('active',Number(b.dataset.v)===Number(v)));
  }
  function getChoice(id){ return Number(document.querySelector('#'+id+' button.active')?.dataset.v||2); }

  function durationToMinutes(v){
    if(!v || !v.includes(':')) return 30;
    const [h,m]=v.split(':').map(Number);
    return Math.max(5,(h||0)*60+(m||0));
  }

  function minutesToDuration(total){
    total=Math.max(5,Math.min(1435,Number(total)||30));
    const h=Math.floor(total/60);
    const m=total%60;
    return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  }

  function updateDurationDisplay(){
    const total=durationToMinutes($('durationPicker').value);
    const h=Math.floor(total/60);
    const m=total%60;
    $('durationDisplay').textContent=(h ? h+'時間' : '') + (m ? m+'分' : '');
    $('durationControlText').textContent=h+':'+String(m).padStart(2,'0');
  }

  function updateDeadlineDisplay(){
    const value=$('deadline').value;
    const label=$('deadlineControlText');
    if(!value){
      label.textContent='未設定';
      label.classList.add('placeholder');
      return;
    }
    const due=new Date(value);
    if(Number.isNaN(due.getTime())){
      label.textContent='未設定';
      label.classList.add('placeholder');
      return;
    }
    const mo=due.getMonth()+1;
    const da=due.getDate();
    const hh=String(due.getHours()).padStart(2,'0');
    const mm=String(due.getMinutes()).padStart(2,'0');
    label.textContent=mo+'月'+da+'日 '+hh+':'+mm;
    label.classList.remove('placeholder');
  }

  function resetForm(){
    editId=null; $('taskName').value=''; $('durationPicker').value='00:30'; updateDurationDisplay(); $('deadline').value=''; updateDeadlineDisplay();
    setChoice('priority',2); setChoice('load',2); $('deleteBtn').style.display='none'; $('saveBtn').textContent='追加する';
  }
  function openEdit(id){
    const t=tasks.find(x=>x.id===id); if(!t)return;
    editId=id; $('taskName').value=t.name;
    $('durationPicker').value=minutesToDuration(t.minutes);
    updateDurationDisplay();
    if(t.deadline && /^\d{4}-\d{2}-\d{2}$/.test(t.deadline)){
      $('deadline').value=t.deadline+'T23:59';
    }else{
      $('deadline').value=t.deadline||'';
    }
    updateDeadlineDisplay();
    setChoice('priority',t.priority); setChoice('load',t.load); $('deleteBtn').style.display='block'; $('saveBtn').textContent='保存する';
    $('tab-add').checked=true; syncHeader();
  }
  function saveForm(){
    const name=$('taskName').value.trim();
    if(!name){
      $('taskName').focus();
      toast('タスク名を入れてね');
      return;
    }
    let totalMinutes=durationToMinutes($('durationPicker').value);
    if(totalMinutes<=0) totalMinutes=5;
    const data={name,minutes:totalMinutes,priority:getChoice('priority'),load:getChoice('load'),deadline:$('deadline').value||null};
    if(editId){
      const i=tasks.findIndex(t=>t.id===editId); if(i>=0)tasks[i]={...tasks[i],...data};
      toast('保存しました');
    }else{
      tasks.unshift({id:uid(),completed:false,createdAt:new Date().toISOString(),...data}); toast('追加しました');
    }
    save(); resetForm(); renderAll(); $('tab-list').checked=true; syncHeader();
  }
  function deleteTask(){
    if(!editId)return;
    tasks=tasks.filter(t=>t.id!==editId);
    if(selectedRecommendId===editId){
      selectedRecommendId=null;
      selectedProgressMinutes=null;
    }
    save(); resetForm(); renderAll(); $('tab-list').checked=true; syncHeader(); toast('削除しました');
  }

  function syncHeader(){
    if($('tab-list').checked){$('title').textContent='タスク一覧';$('sub').textContent='全部ここで見える。';renderList();}
    else if($('tab-add').checked){$('title').textContent=editId?'タスクを編集':'タスクを追加';$('sub').textContent='入力は必要なものだけ。';}
    else {$('title').textContent='いまやる';$('sub').textContent='空いた時間に、迷わずひとつ。';renderUrgent();renderRecommend();}
  }
  function renderAll(){renderUrgent();renderRecommend();renderList();}
  function toast(s){const e=$('toast');e.textContent=s;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1500)}

  document.querySelectorAll('input[name=tab]').forEach(x=>x.addEventListener('change',()=>{
    if(x.id==='tab-add' && !editId) resetForm();
    syncHeader();
  }));
  document.querySelectorAll('input[name=time],input[name=energy]').forEach(x=>x.addEventListener('change',()=>{ $('customTime').value=''; renderRecommend(); }));
  $('customTime').addEventListener('input',renderRecommend);
  ['priority','load'].forEach(id=>document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>setChoice(id,b.dataset.v)));
  $('taskForm').addEventListener('submit',e=>{
    e.preventDefault();
    if(e.submitter && e.submitter.id!=='saveBtn') return;
    saveForm();
  });
  $('deleteBtn').onclick=deleteTask;
  $('search').addEventListener('input',renderList);
  document.querySelectorAll('input[name=listmode]').forEach(x=>x.addEventListener('change',renderList));
  $('durationPicker').addEventListener('input',updateDurationDisplay);
  $('durationPicker').addEventListener('change',updateDurationDisplay);
  $('deadline').addEventListener('input',updateDeadlineDisplay);
  $('deadline').addEventListener('change',updateDeadlineDisplay);

  document.addEventListener('click',e=>{
    if(e.target.closest('.swipe-item')) return;
    closeAllSwipeItems();
  });
  document.addEventListener('touchstart',e=>{
    if(e.target.closest('.swipe-item')) return;
    closeAllSwipeItems();
  }, {passive:true});

  document.documentElement.dataset.js='on';
  updateDurationDisplay();updateDeadlineDisplay();renderAll();syncHeader();
})();
</script>
</body>
</html>
